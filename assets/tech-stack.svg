<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="100%" height="auto">
  <defs>
    <pattern id="mGrid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M 14 0 L 0 0 0 14" fill="none" stroke="#1F2A37" stroke-width="0.75" opacity="0.6"/>
    </pattern>
    <linearGradient id="mOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C44E18" />
      <stop offset="100%" stop-color="#E0732E" />
    </linearGradient>
    <linearGradient id="mGolden" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D5A62D" />
      <stop offset="100%" stop-color="#ECC24E" />
    </linearGradient>
    <linearGradient id="mNavy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F5882" />
      <stop offset="100%" stop-color="#4D7FA9" />
    </linearGradient>
    <linearGradient id="mGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Space Mono', 'Consolas', 'Courier New', monospace; }
  </style>

  <!-- Container Box -->
  <rect width="840" height="330" rx="8" fill="#111417" stroke="#2E4C70" stroke-width="1.5" />
  <rect width="840" height="330" rx="8" fill="url(#mGrid)" />

  <!-- Section Header -->
  <g class="mono" transform="translate(24, 28)">
    <text x="0" y="0" fill="#E0732E" font-size="11" font-weight="700" letter-spacing="0.1em">[02. CAPABILITIES &amp; WEAPONRY]</text>
    <text x="310" y="0" fill="#64748B" font-size="10.5" letter-spacing="0.08em">// TACTICAL ARSENAL MATRIX</text>
    <text x="792" y="0" text-anchor="end" fill="#94A3B8" font-size="10.5" letter-spacing="0.08em">INDEX: ARCHIVAL-78</text>
    <line x1="0" y1="10" x2="792" y2="10" stroke="#2E4C70" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
  </g>

  <!-- 4 Tactical Cards Grid -->
  <!-- Card 1: Offensive Security -->
  <g transform="translate(24, 52)">
    <rect x="2" y="3" width="384" height="122" rx="6" fill="#050B12" opacity="0.8" />
    <rect width="384" height="122" rx="6" fill="#161A20" stroke="#2E4C70" stroke-width="1.2" />
    <rect width="4" height="122" rx="1" fill="#E0732E" />
    <g class="mono" transform="translate(16, 22)">
      <text x="0" y="0" fill="#E0732E" font-size="9.5" font-weight="700" letter-spacing="0.08em">DOM_01 // OFFENSIVE SECURITY</text>
      <text x="0" y="16" fill="#EDE8DC" font-size="11" font-weight="700">Exploitation &amp; Penetration Testing</text>
      <text x="0" y="38" fill="#94A3B8" font-size="9.5">Burp Suite Pro • Nmap • Metasploit • Wireshark</text>
      <text x="0" y="52" fill="#94A3B8" font-size="9.5">OWASP Top 10 • Privilege Escalation • Pivoting</text>
      <text x="0" y="66" fill="#94A3B8" font-size="9.5">Active Directory Basics • Post-Exploitation</text>

      <rect x="0" y="78" width="350" height="4" rx="2" fill="#222A34" />
      <rect x="0" y="78" width="332" height="4" rx="2" fill="url(#mOrange)" />
      <text x="350" y="93" text-anchor="end" fill="#E0732E" font-size="8.5" font-weight="700">READINESS: 95%</text>
    </g>
  </g>

  <!-- Card 2: Software Engineering -->
  <g transform="translate(432, 52)">
    <rect x="2" y="3" width="384" height="122" rx="6" fill="#050B12" opacity="0.8" />
    <rect width="384" height="122" rx="6" fill="#161A20" stroke="#2E4C70" stroke-width="1.2" />
    <rect width="4" height="122" rx="1" fill="#E0B23A" />
    <g class="mono" transform="translate(16, 22)">
      <text x="0" y="0" fill="#E0B23A" font-size="9.5" font-weight="700" letter-spacing="0.08em">DOM_02 // SOFTWARE ENGINEERING</text>
      <text x="0" y="16" fill="#EDE8DC" font-size="11" font-weight="700">Full-Stack &amp; Scalable Backends</text>
      <text x="0" y="38" fill="#94A3B8" font-size="9.5">Python • Django REST Framework • TypeScript</text>
      <text x="0" y="52" fill="#94A3B8" font-size="9.5">React.js • PostgreSQL • SQLite • Vite • Node.js</text>
      <text x="0" y="66" fill="#94A3B8" font-size="9.5">RESTful APIs • Clean Architecture • Async</text>

      <rect x="0" y="78" width="350" height="4" rx="2" fill="#222A34" />
      <rect x="0" y="78" width="322" height="4" rx="2" fill="url(#mGolden)" />
      <text x="350" y="93" text-anchor="end" fill="#E0B23A" font-size="8.5" font-weight="700">READINESS: 92%</text>
    </g>
  </g>

  <!-- Card 3: Defensive & Cryptography -->
  <g transform="translate(24, 188)">
    <rect x="2" y="3" width="384" height="122" rx="6" fill="#050B12" opacity="0.8" />
    <rect width="384" height="122" rx="6" fill="#161A20" stroke="#2E4C70" stroke-width="1.2" />
    <rect width="4" height="122" rx="1" fill="#4D7FA9" />
    <g class="mono" transform="translate(16, 22)">
      <text x="0" y="0" fill="#4D7FA9" font-size="9.5" font-weight="700" letter-spacing="0.08em">DOM_03 // DEFENSE &amp; CRYPTOGRAPHY</text>
      <text x="0" y="16" fill="#EDE8DC" font-size="11" font-weight="700">Hardened Resilient Architectures</text>
      <text x="0" y="38" fill="#94A3B8" font-size="9.5">AES-256-GCM E2EE • Zero-Knowledge Storage</text>
      <text x="0" y="52" fill="#94A3B8" font-size="9.5">IDOR Hardening • JWT Guards • CORS/HSTS</text>
      <text x="0" y="66" fill="#94A3B8" font-size="9.5">Threat Modeling • Security Code Audit</text>

      <rect x="0" y="78" width="350" height="4" rx="2" fill="#222A34" />
      <rect x="0" y="78" width="315" height="4" rx="2" fill="url(#mNavy)" />
      <text x="350" y="93" text-anchor="end" fill="#4D7FA9" font-size="8.5" font-weight="700">READINESS: 90%</text>
    </g>
  </g>

  <!-- Card 4: Environments & Systems -->
  <g transform="translate(432, 188)">
    <rect x="2" y="3" width="384" height="122" rx="6" fill="#050B12" opacity="0.8" />
    <rect width="384" height="122" rx="6" fill="#161A20" stroke="#2E4C70" stroke-width="1.2" />
    <rect width="4" height="122" rx="1" fill="#22C55E" />
    <g class="mono" transform="translate(16, 22)">
      <text x="0" y="0" fill="#22C55E" font-size="9.5" font-weight="700" letter-spacing="0.08em">DOM_04 // SYSTEMS &amp; INFRASTRUCTURE</text>
      <text x="0" y="16" fill="#EDE8DC" font-size="11" font-weight="700">Linux Labs &amp; Automated Pipelines</text>
      <text x="0" y="38" fill="#94A3B8" font-size="9.5">Kali Linux • Ubuntu Server • Arch Linux • Bash</text>
      <text x="0" y="52" fill="#94A3B8" font-size="9.5">Docker Containers • GitHub Actions CI/CD</text>
      <text x="0" y="66" fill="#94A3B8" font-size="9.5">Render Platform • Cloudflare • Postman</text>

      <rect x="0" y="78" width="350" height="4" rx="2" fill="#222A34" />
      <rect x="0" y="78" width="308" height="4" rx="2" fill="url(#mGreen)" />
      <text x="350" y="93" text-anchor="end" fill="#22C55E" font-size="8.5" font-weight="700">READINESS: 88%</text>
    </g>
  </g>
</svg>