<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="100%" height="100%">
  <defs>
    <pattern id="matrixGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(46, 76, 112, 0.15)" stroke-width="0.75"/>
    </pattern>
    <linearGradient id="meterOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C44E18" />
      <stop offset="100%" stop-color="#E0732E" />
    </linearGradient>
    <linearGradient id="meterGolden" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D5A62D" />
      <stop offset="100%" stop-color="#ECC24E" />
    </linearGradient>
    <linearGradient id="meterNavy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F5882" />
      <stop offset="100%" stop-color="#4D7FA9" />
    </linearGradient>
    <linearGradient id="meterGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <filter id="cardShadow" x="-3%" y="-5%" width="106%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="0" flood-color="#050B12" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Space Mono', 'Consolas', 'Courier New', monospace; }
    .heading { font-family: 'Syne', 'Arial Black', sans-serif; font-weight: 800; }
  </style>

  <!-- Container Box -->
  <rect width="940" height="360" rx="10" fill="#111417" stroke="#2E4C70" stroke-width="1.5" />
  <rect width="940" height="360" rx="10" fill="url(#matrixGrid)" />

  <!-- Section Header -->
  <g class="mono" transform="translate(30, 32)">
    <text x="0" y="0" fill="#E0732E" font-size="12" font-weight="700" letter-spacing="0.1em">[02. CAPABILITIES &amp; WEAPONRY]</text>
    <text x="350" y="0" fill="#64748B" font-size="11" letter-spacing="0.08em">// TECHNICAL ARSENAL MATRIX</text>
    <text x="880" y="0" text-anchor="end" fill="#94A3B8" font-size="11" letter-spacing="0.08em">INDEX: ARCHIVAL-78</text>
    <line x1="0" y1="12" x2="880" y2="12" stroke="#2E4C70" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
  </g>

  <!-- 4 Tactical Cards Grid -->
  <!-- Card 1: Offensive Security -->
  <g transform="translate(30, 60)" filter="url(#cardShadow)">
    <rect width="425" height="135" rx="6" fill="#161A20" stroke="#2E4C70" stroke-width="1.2" />
    <rect width="4" height="135" rx="1" fill="#E0732E" />
    <g class="mono" transform="translate(18, 24)">
      <text x="0" y="0" fill="#E0732E" font-size="10" font-weight="700" letter-spacing="0.1em">DOM_01 // OFFENSIVE SECURITY</text>
      <text x="0" y="18" fill="#EDE8DC" font-size="12" font-weight="700">Exploitation &amp; Penetration Testing</text>
      
      <!-- Tags -->
      <text x="0" y="42" fill="#94A3B8" font-size="10" letter-spacing="0.04em">Burp Suite Pro • Nmap • Metasploit • Wireshark</text>
      <text x="0" y="58" fill="#94A3B8" font-size="10" letter-spacing="0.04em">OWASP Top 10 • Privilege Escalation • Pivoting</text>
      <text x="0" y="74" fill="#94A3B8" font-size="10" letter-spacing="0.04em">Active Directory Basics • Linux/Windows Post-Exploit</text>

      <!-- Readiness bar -->
      <rect x="0" y="86" width="385" height="4" rx="2" fill="#222A34" />
      <rect x="0" y="86" width="365" height="4" rx="2" fill="url(#meterOrange)" />
      <text x="385" y="102" text-anchor="end" fill="#E0732E" font-size="9" font-weight="700">READINESS: 95%</text>
    </g>
  </g>

  <!-- Card 2: Software Engineering -->
  <g transform="translate(485, 60)" filter="url(#cardShadow)">
    <rect width="425" height="135" rx="6" fill="#161A20" stroke="#2E4C70" stroke-width="1.2" />
    <rect width="4" height="135" rx="1" fill="#E0B23A" />
    <g class="mono" transform="translate(18, 24)">
      <text x="0" y="0" fill="#E0B23A" font-size="10" font-weight="700" letter-spacing="0.1em">DOM_02 // SOFTWARE ENGINEERING</text>
      <text x="0" y="18" fill="#EDE8DC" font-size="12" font-weight="700">Full-Stack &amp; Scalable Backends</text>
      
      <!-- Tags -->
      <text x="0" y="42" fill="#94A3B8" font-size="10" letter-spacing="0.04em">Python • Django REST Framework • TypeScript</text>
      <text x="0" y="58" fill="#94A3B8" font-size="10" letter-spacing="0.04em">React.js • PostgreSQL • SQLite • Vite • Node.js</text>
      <text x="0" y="74" fill="#94A3B8" font-size="10" letter-spacing="0.04em">RESTful API Design • Clean Architecture • Async Workers</text>

      <!-- Readiness bar -->
      <rect x="0" y="86" width="385" height="4" rx="2" fill="#222A34" />
      <rect x="0" y="86" width="350" height="4" rx="2" fill="url(#meterGolden)" />
      <text x="385" y="102" text-anchor="end" fill="#E0B23A" font-size="9" font-weight="700">READINESS: 92%</text>
    </g>
  </g>

  <!-- Card 3: Defensive & Cryptography -->
  <g transform="translate(30, 210)" filter="url(#cardShadow)">
    <rect width="425" height="130" rx="6" fill="#161A20" stroke="#2E4C70" stroke-width="1.2" />
    <rect width="4" height="130" rx="1" fill="#4D7FA9" />
    <g class="mono" transform="translate(18, 24)">
      <text x="0" y="0" fill="#4D7FA9" font-size="10" font-weight="700" letter-spacing="0.1em">DOM_03 // DEFENSE &amp; CRYPTOGRAPHY</text>
      <text x="0" y="18" fill="#EDE8DC" font-size="12" font-weight="700">Hardened Resilient Architectures</text>
      
      <!-- Tags -->
      <text x="0" y="42" fill="#94A3B8" font-size="10" letter-spacing="0.04em">AES-256-GCM E2EE • Zero-Knowledge Storage</text>
      <text x="0" y="58" fill="#94A3B8" font-size="10" letter-spacing="0.04em">IDOR Hardening • JWT &amp; Auth Guards • CORS/HSTS</text>
      <text x="0" y="74" fill="#94A3B8" font-size="10" letter-spacing="0.04em">Threat Modeling • Security Audit &amp; Code Review</text>

      <!-- Readiness bar -->
      <rect x="0" y="86" width="385" height="4" rx="2" fill="#222A34" />
      <rect x="0" y="86" width="345" height="4" rx="2" fill="url(#meterNavy)" />
      <text x="385" y="102" text-anchor="end" fill="#4D7FA9" font-size="9" font-weight="700">READINESS: 90%</text>
    </g>
  </g>

  <!-- Card 4: Environments & Tooling -->
  <g transform="translate(485, 210)" filter="url(#cardShadow)">
    <rect width="425" height="130" rx="6" fill="#161A20" stroke="#2E4C70" stroke-width="1.2" />
    <rect width="4" height="130" rx="1" fill="#22C55E" />
    <g class="mono" transform="translate(18, 24)">
      <text x="0" y="0" fill="#22C55E" font-size="10" font-weight="700" letter-spacing="0.1em">DOM_04 // SYSTEMS &amp; CLOUD INFRA</text>
      <text x="0" y="18" fill="#EDE8DC" font-size="12" font-weight="700">Linux Labs &amp; Automated Pipelines</text>
      
      <!-- Tags -->
      <text x="0" y="42" fill="#94A3B8" font-size="10" letter-spacing="0.04em">Kali Linux • Ubuntu Server • Arch Linux • Bash</text>
      <text x="0" y="58" fill="#94A3B8" font-size="10" letter-spacing="0.04em">Docker Containers • Git / GitHub Actions CI/CD</text>
      <text x="0" y="74" fill="#94A3B8" font-size="10" letter-spacing="0.04em">Render Platform • Cloudflare • Postman • Gunicorn</text>

      <!-- Readiness bar -->
      <rect x="0" y="86" width="385" height="4" rx="2" fill="#222A34" />
      <rect x="0" y="86" width="340" height="4" rx="2" fill="url(#meterGreen)" />
      <text x="385" y="102" text-anchor="end" fill="#22C55E" font-size="9" font-weight="700">READINESS: 88%</text>
    </g>
  </g>
</svg>