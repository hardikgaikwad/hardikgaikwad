<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 210" width="100%" height="auto">
  <defs>
    <!-- Background Graph Grid Pattern -->
    <pattern id="hMinorGrid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M 14 0 L 0 0 0 14" fill="none" stroke="#1F2A37" stroke-width="0.75"/>
    </pattern>
    <pattern id="hMajorGrid" width="70" height="70" patternUnits="userSpaceOnUse">
      <rect width="70" height="70" fill="url(#hMinorGrid)" />
      <path d="M 70 0 L 0 0 0 70" fill="none" stroke="#2E4C70" stroke-width="1.2" opacity="0.6"/>
    </pattern>

    <!-- Retro Title Burnt Orange to Golden Fill Gradient -->
    <linearGradient id="hTitleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C44E18" />
      <stop offset="28%" stop-color="#D56A25" />
      <stop offset="62%" stop-color="#DB8324" />
      <stop offset="100%" stop-color="#E5A823" />
    </linearGradient>

    <!-- Horizontal Print Stripes Pattern -->
    <pattern id="hPrintStripes" width="10" height="4" patternUnits="userSpaceOnUse">
      <rect width="10" height="1.6" fill="#0B1929" opacity="0.5" />
      <rect y="1.6" width="10" height="2.4" fill="transparent" />
    </pattern>

    <!-- Badge Background Gradient -->
    <linearGradient id="hBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2533" />
      <stop offset="100%" stop-color="#141C27" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Space Mono', 'Consolas', 'Courier New', monospace; }
    .display-title { font-family: 'Syne', 'Impact', 'Arial Black', -apple-system, sans-serif; font-size: 42px; font-weight: 900; letter-spacing: 0.05em; }
  </style>

  <!-- Base Archival Background -->
  <rect width="840" height="210" rx="8" fill="#111417" stroke="#2E4C70" stroke-width="1.5" />
  <rect width="840" height="210" rx="8" fill="url(#hMajorGrid)" />

  <!-- Corner Blueprint Technical Crosshairs -->
  <path d="M 12 20 L 22 20 M 22 10 L 22 20" stroke="#4D7FA9" stroke-width="1.5" fill="none" opacity="0.8" />
  <path d="M 828 20 L 818 20 M 818 10 L 818 20" stroke="#4D7FA9" stroke-width="1.5" fill="none" opacity="0.8" />
  <path d="M 12 190 L 22 190 M 22 200 L 22 190" stroke="#4D7FA9" stroke-width="1.5" fill="none" opacity="0.8" />
  <path d="M 828 190 L 818 190 M 818 200 L 818 190" stroke="#4D7FA9" stroke-width="1.5" fill="none" opacity="0.8" />

  <!-- Top Security Header Bar -->
  <g class="mono">
    <!-- Live Status Indicator -->
    <circle cx="34" cy="26" r="3.5" fill="#22C55E" />
    <text x="46" y="30" fill="#22C55E" font-size="10" font-weight="700" letter-spacing="0.08em">SEC_SYSTEM_STATUS: NOMINAL</text>

    <!-- Central Protocol Tag -->
    <text x="420" y="30" fill="#64748B" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.08em">TERMINAL PROTOCOL v2.4.0</text>

    <!-- Clearance Identification -->
    <text x="806" y="30" fill="#E0B23A" font-size="10" font-weight="700" text-anchor="end" letter-spacing="0.08em">LEVEL-3 [TOP SECRET]</text>

    <!-- Top Rule Separator -->
    <line x1="26" y1="38" x2="814" y2="38" stroke="#2E4C70" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  </g>

  <!-- Centerpiece: 3D Extruded HARDIK GAIKWAD Wordmark (Proportionally Sized) -->
  <g id="wordmark">
    <!-- 1. Deep Navy 3D Drop Shadow -->
    <text x="420" y="94" text-anchor="middle" class="display-title" fill="#050B12" dx="4" dy="5" opacity="0.95">HARDIK GAIKWAD</text>
    
    <!-- 2. Medium Navy 3D Shadow -->
    <text x="420" y="94" text-anchor="middle" class="display-title" fill="#102B47" dx="2" dy="3" opacity="0.9">HARDIK GAIKWAD</text>
    
    <!-- 3. Dark Navy Contour Framing Outline -->
    <text x="420" y="94" text-anchor="middle" class="display-title" fill="none" stroke="#001F3F" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">HARDIK GAIKWAD</text>

    <!-- 4. Burnt Orange to Golden Gradient Fill -->
    <text x="420" y="94" text-anchor="middle" class="display-title" fill="url(#hTitleGrad)">HARDIK GAIKWAD</text>

    <!-- 5. Horizontal Print Stripe Texture Overlay -->
    <text x="420" y="94" text-anchor="middle" class="display-title" fill="url(#hPrintStripes)" opacity="0.3" pointer-events="none">HARDIK GAIKWAD</text>
  </g>

  <!-- Motto Subtitle -->
  <g class="mono">
    <text x="420" y="125" text-anchor="middle" fill="#EDE8DC" font-size="11.5" font-weight="700" letter-spacing="0.1em">
      <tspan fill="#E0732E">&gt;_ </tspan>BUILD IT. BREAK IT. SECURE IT. <tspan fill="#64748B">—</tspan> <tspan fill="#E0B23A">OFFENSIVE SECURITY &amp; BACKEND ARCHITECTURE</tspan>
    </text>
  </g>

  <!-- Bottom Badges Row (Centered & Symmetrical) -->
  <g class="mono" transform="translate(30, 145)">
    <!-- Badge 1: eJPT -->
    <g>
      <rect x="0" y="2" width="180" height="2" fill="#050B12" rx="1" />
      <rect x="0" y="0" width="180" height="34" rx="4" fill="url(#hBadgeGrad)" stroke="#2E4C70" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="34" rx="1" fill="#E0732E" />
      <text x="14" y="15" fill="#94A3B8" font-size="8.5" font-weight="600" letter-spacing="0.08em">CERTIFICATION</text>
      <text x="14" y="27" fill="#EDE8DC" font-size="10.5" font-weight="700">eJPT CERTIFIED 🛡️</text>
    </g>

    <!-- Badge 2: TryHackMe -->
    <g transform="translate(196, 0)">
      <rect x="0" y="2" width="190" height="2" fill="#050B12" rx="1" />
      <rect x="0" y="0" width="190" height="34" rx="4" fill="url(#hBadgeGrad)" stroke="#2E4C70" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="34" rx="1" fill="#E0B23A" />
      <text x="14" y="15" fill="#94A3B8" font-size="8.5" font-weight="600" letter-spacing="0.08em">TRYHACKME RANK</text>
      <text x="14" y="27" fill="#E0B23A" font-size="10.5" font-weight="700">GLOBAL TOP 4% 🏆</text>
    </g>

    <!-- Badge 3: Academic -->
    <g transform="translate(402, 0)">
      <rect x="0" y="2" width="190" height="2" fill="#050B12" rx="1" />
      <rect x="0" y="0" width="190" height="34" rx="4" fill="url(#hBadgeGrad)" stroke="#2E4C70" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="34" rx="1" fill="#3B6B9B" />
      <text x="14" y="15" fill="#94A3B8" font-size="8.5" font-weight="600" letter-spacing="0.08em">ACADEMICS @ JEC</text>
      <text x="14" y="27" fill="#EDE8DC" font-size="10.5" font-weight="700">B.TECH IT (7.69) 🎓</text>
    </g>

    <!-- Badge 4: Specialization -->
    <g transform="translate(608, 0)">
      <rect x="0" y="2" width="172" height="2" fill="#050B12" rx="1" />
      <rect x="0" y="0" width="172" height="34" rx="4" fill="url(#hBadgeGrad)" stroke="#2E4C70" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="34" rx="1" fill="#22C55E" />
      <text x="14" y="15" fill="#94A3B8" font-size="8.5" font-weight="600" letter-spacing="0.08em">SPECIALIZATION</text>
      <text x="14" y="27" fill="#EDE8DC" font-size="10.5" font-weight="700">WEB PENTESTING ⚡</text>
    </g>
  </g>

  <!-- Bottom Technical Coordinate Rule -->
  <g class="mono">
    <line x1="26" y1="192" x2="814" y2="192" stroke="#2E4C70" stroke-width="1" stroke-dasharray="2,4" opacity="0.6" />
    <text x="34" y="203" fill="#64748B" font-size="8.5" letter-spacing="0.08em">SYS_LOC: 23°10'N 79°56'E [IN]</text>
    <text x="420" y="203" fill="#4D7FA9" font-size="8.5" text-anchor="middle" letter-spacing="0.08em">GRAPH REPRO-PAPER // HARDENED ARCHITECTURE</text>
    <text x="806" y="203" fill="#64748B" font-size="8.5" text-anchor="end" letter-spacing="0.08em">DISPATCH #H4DK-2026</text>
  </g>
</svg>