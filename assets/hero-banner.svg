<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 280" width="100%" height="100%">
  <defs>
    <!-- Background Graph Grid Pattern -->
    <pattern id="minorGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(46, 76, 112, 0.18)" stroke-width="0.75"/>
    </pattern>
    <pattern id="majorGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="url(#minorGrid)" />
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(65, 107, 155, 0.38)" stroke-width="1.2"/>
    </pattern>

    <!-- Retro Title Burnt Orange to Golden Fill Gradient -->
    <linearGradient id="retroTitleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C44E18" />
      <stop offset="28%" stop-color="#D56A25" />
      <stop offset="62%" stop-color="#DB8324" />
      <stop offset="100%" stop-color="#E5A823" />
    </linearGradient>

    <!-- Horizontal Print Texture Stripes -->
    <pattern id="printStripes" width="10" height="4" patternUnits="userSpaceOnUse">
      <rect width="10" height="1.6" fill="rgba(11, 25, 41, 0.45)" />
      <rect y="1.6" width="10" height="2.4" fill="transparent" />
    </pattern>

    <!-- Badge Background Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2533" />
      <stop offset="100%" stop-color="#141C27" />
    </linearGradient>

    <!-- Drop Shadow Filter for Badges -->
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="0" flood-color="#050B12" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Space Mono', 'Consolas', 'Courier New', monospace; }
    .display-title { font-family: 'Syne', 'Arial Black', 'Impact', -apple-system, sans-serif; font-size: 64px; font-weight: 900; letter-spacing: 0.04em; }
    .pulse-dot { animation: pulse 2s infinite ease-in-out; }
    @keyframes pulse {
      0%, 100% { opacity: 1; r: 3.5; }
      50% { opacity: 0.4; r: 2.5; }
    }
  </style>

  <!-- Base Archival Background -->
  <rect width="940" height="280" rx="10" fill="#111417" stroke="#2E4C70" stroke-width="1.5" />
  <rect width="940" height="280" rx="10" fill="url(#majorGrid)" />

  <!-- Corner Blueprint Technical Crosshairs -->
  <path d="M 12 24 L 24 24 M 24 12 L 24 24" stroke="#4D7FA9" stroke-width="1.5" fill="none" opacity="0.8" />
  <path d="M 928 24 L 916 24 M 916 12 L 916 24" stroke="#4D7FA9" stroke-width="1.5" fill="none" opacity="0.8" />
  <path d="M 12 256 L 24 256 M 24 268 L 24 256" stroke="#4D7FA9" stroke-width="1.5" fill="none" opacity="0.8" />
  <path d="M 928 256 L 916 256 M 916 268 L 916 256" stroke="#4D7FA9" stroke-width="1.5" fill="none" opacity="0.8" />

  <!-- Top Security Header Bar -->
  <g class="mono">
    <!-- Live Status Indicator -->
    <circle cx="38" cy="34" r="3.5" fill="#22C55E" class="pulse-dot" />
    <text x="50" y="38" fill="#22C55E" font-size="11" font-weight="700" letter-spacing="0.08em">SEC_SYSTEM_STATUS: NOMINAL</text>

    <!-- Central Protocol Tag -->
    <text x="470" y="38" fill="#64748B" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.1em">TERMINAL PROTOCOL v2.4.0 // ARCHIVAL DOSSIER</text>

    <!-- Clearance Identification -->
    <text x="902" y="38" fill="#E0B23A" font-size="11" font-weight="700" text-anchor="end" letter-spacing="0.08em">CLEARANCE: LEVEL-3 [TOP SECRET]</text>

    <!-- Top Rule Separator -->
    <line x1="32" y1="48" x2="908" y2="48" stroke="#2E4C70" stroke-width="1" stroke-dasharray="4,4" opacity="0.7" />
  </g>

  <!-- Centerpiece: 3D Extruded HARDIK GAIKWAD Wordmark -->
  <g id="wordmark">
    <!-- 1. Deep Shadow Extrusion -->
    <text x="470" y="125" text-anchor="middle" class="display-title" fill="#050B12" dx="6" dy="7" opacity="0.95">HARDIK GAIKWAD</text>
    
    <!-- 2. Medium Shadow Extrusion -->
    <text x="470" y="125" text-anchor="middle" class="display-title" fill="#102B47" dx="3" dy="4" opacity="0.9">HARDIK GAIKWAD</text>
    
    <!-- 3. Dark Navy Contour Framing Outline -->
    <text x="470" y="125" text-anchor="middle" class="display-title" fill="none" stroke="#001F3F" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">HARDIK GAIKWAD</text>

    <!-- 4. Burnt Orange to Golden Gradient Fill -->
    <text x="470" y="125" text-anchor="middle" class="display-title" fill="url(#retroTitleGradient)">HARDIK GAIKWAD</text>

    <!-- 5. Horizontal Print Stripe Texture Overlay -->
    <text x="470" y="125" text-anchor="middle" class="display-title" fill="url(#printStripes)" opacity="0.32" pointer-events="none">HARDIK GAIKWAD</text>
  </g>

  <!-- Motto Subtitle -->
  <g class="mono">
    <text x="470" y="165" text-anchor="middle" fill="#EDE8DC" font-size="13" font-weight="700" letter-spacing="0.12em">
      <tspan fill="#E0732E">&gt;_ </tspan>BUILD IT. BREAK IT. SECURE IT. <tspan fill="#64748B">—</tspan> <tspan fill="#E0B23A">OFFENSIVE SECURITY &amp; BACKEND ARCHITECTURE</tspan>
    </text>
  </g>

  <!-- Bottom Badges Row -->
  <g class="mono" transform="translate(42, 196)">
    <!-- Badge 1: eJPT -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="186" height="38" rx="4" fill="url(#badgeGrad)" stroke="#2E4C70" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="38" rx="1" fill="#E0732E" />
      <text x="16" y="17" fill="#94A3B8" font-size="9" font-weight="600" letter-spacing="0.08em">CERTIFICATION</text>
      <text x="16" y="30" fill="#EDE8DC" font-size="11" font-weight="800" letter-spacing="0.04em">eJPT CERTIFIED 🛡️</text>
    </g>

    <!-- Badge 2: TryHackMe -->
    <g transform="translate(202, 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="210" height="38" rx="4" fill="url(#badgeGrad)" stroke="#2E4C70" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="38" rx="1" fill="#E0B23A" />
      <text x="16" y="17" fill="#94A3B8" font-size="9" font-weight="600" letter-spacing="0.08em">TRYHACKME RANK</text>
      <text x="16" y="30" fill="#E0B23A" font-size="11" font-weight="800" letter-spacing="0.04em">GLOBAL TOP 4% 🏆</text>
    </g>

    <!-- Badge 3: Education -->
    <g transform="translate(428, 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="220" height="38" rx="4" fill="url(#badgeGrad)" stroke="#2E4C70" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="38" rx="1" fill="#3B6B9B" />
      <text x="16" y="17" fill="#94A3B8" font-size="9" font-weight="600" letter-spacing="0.08em">ACADEMIC CREDENTIAL</text>
      <text x="16" y="30" fill="#EDE8DC" font-size="11" font-weight="800" letter-spacing="0.04em">B.TECH IT @ JEC (7.69) 🎓</text>
    </g>

    <!-- Badge 4: Focus Area -->
    <g transform="translate(664, 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="192" height="38" rx="4" fill="url(#badgeGrad)" stroke="#2E4C70" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="38" rx="1" fill="#22C55E" />
      <text x="16" y="17" fill="#94A3B8" font-size="9" font-weight="600" letter-spacing="0.08em">ACTIVE SPECIALIZATION</text>
      <text x="16" y="30" fill="#EDE8DC" font-size="11" font-weight="800" letter-spacing="0.04em">WEB APP PENTESTING ⚡</text>
    </g>
  </g>

  <!-- Bottom Technical Coordinate Rule -->
  <g class="mono">
    <line x1="32" y1="254" x2="908" y2="254" stroke="#2E4C70" stroke-width="1" stroke-dasharray="2,4" opacity="0.6" />
    <text x="42" y="268" fill="#64748B" font-size="9" letter-spacing="0.1em">SYS_LOC: 23°10'N 79°56'E [IN]</text>
    <text x="470" y="268" fill="#4D7FA9" font-size="9" text-anchor="middle" letter-spacing="0.1em">AUTHENTIC GRAPH REPRO-PAPER // 60FPS CSS ENGINE</text>
    <text x="898" y="268" fill="#64748B" font-size="9" text-anchor="end" letter-spacing="0.1em">ENCRYPTED DISPATCH #H4DK-2026</text>
  </g>
</svg>