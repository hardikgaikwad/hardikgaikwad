<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="100%" height="auto">
  <defs>
    <!-- Background Graph Grid Pattern -->
    <pattern id="tGrid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M 14 0 L 0 0 0 14" fill="none" stroke="#1E293B" stroke-width="0.75" opacity="0.6"/>
    </pattern>

    <linearGradient id="tHeaderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2533" />
      <stop offset="100%" stop-color="#111822" />
    </linearGradient>
  </defs>

  <style>
    .t-mono { font-family: 'Space Mono', 'Consolas', 'Courier New', monospace; }
  </style>

  <!-- Terminal Drop Shadow Box (Standard SVG 1.1) -->
  <rect x="14" y="14" width="816" height="306" rx="8" fill="#050B12" opacity="0.8" />

  <!-- Main Terminal Box -->
  <rect x="10" y="10" width="820" height="310" rx="8" fill="#0D1117" stroke="#2E4C70" stroke-width="1.5" />
  <rect x="10" y="10" width="820" height="310" rx="8" fill="url(#tGrid)" />

  <!-- Terminal Header Bar -->
  <rect x="10" y="10" width="820" height="34" rx="8" fill="url(#tHeaderGrad)" />
  <rect x="10" y="36" width="820" height="8" fill="#111822" />
  <line x1="10" y1="44" x2="830" y2="44" stroke="#2E4C70" stroke-width="1.2" />

  <!-- Window Controls -->
  <circle cx="28" cy="27" r="5" fill="#FF5F56" />
  <circle cx="44" cy="27" r="5" fill="#FFBD2E" />
  <circle cx="60" cy="27" r="5" fill="#27C93F" />

  <!-- Header Title -->
  <text x="420" y="30" text-anchor="middle" class="t-mono" fill="#94A3B8" font-size="11" font-weight="600" letter-spacing="0.08em">
    hardik@kali: ~/pentest  <tspan fill="#4D7FA9">[BASH 5.2 // OFFSEC ENCRYPTED SHELL]</tspan>
  </text>

  <!-- Right Online Status Indicator -->
  <circle cx="798" cy="27" r="3" fill="#22C55E" />
  <text x="814" y="30" text-anchor="end" class="t-mono" fill="#22C55E" font-size="10.5" font-weight="700" letter-spacing="0.06em">
    ONLINE
  </text>

  <!-- Terminal Commands & Outputs -->
  <g class="t-mono" font-size="12">
    <!-- Command 1 -->
    <text x="32" y="74">
      <tspan fill="#E0732E" font-weight="700">hardik@kali</tspan><tspan fill="#94A3B8">:</tspan><tspan fill="#4D7FA9">~</tspan><tspan fill="#E0B23A" font-weight="700">$</tspan> <tspan fill="#EDE8DC" font-weight="700">whoami</tspan>
    </text>
    <!-- Output 1 -->
    <text x="32" y="96" fill="#22C55E" font-weight="600">
      hardik <tspan fill="#64748B">—</tspan> <tspan fill="#EDE8DC">Offensive Security Researcher &amp; Software Engineer</tspan> <tspan fill="#E0B23A">[eJPT | THM Top 4%]</tspan>
    </text>

    <!-- Command 2 -->
    <text x="32" y="126">
      <tspan fill="#E0732E" font-weight="700">hardik@kali</tspan><tspan fill="#94A3B8">:</tspan><tspan fill="#4D7FA9">~</tspan><tspan fill="#E0B23A" font-weight="700">$</tspan> <tspan fill="#EDE8DC" font-weight="700">nmap -sV -sC -Pn target.corp</tspan>
    </text>
    <!-- Output 2 (Nmap Port Scan) -->
    <text x="32" y="148" fill="#4D7FA9">
      [+] 22/tcp  <tspan fill="#22C55E">OPEN</tspan>  <tspan fill="#94A3B8">ssh</tspan>     <tspan fill="#EDE8DC">OpenSSH 8.9p1 Ubuntu (KeyAuth Enforced)</tspan>
    </text>
    <text x="32" y="168" fill="#4D7FA9">
      [+] 80/tcp  <tspan fill="#22C55E">OPEN</tspan>  <tspan fill="#94A3B8">http</tspan>    <tspan fill="#EDE8DC">Apache/2.4.52 (OWASP Top 10 Hardened / HSTS)</tspan>
    </text>
    <text x="32" y="188" fill="#4D7FA9">
      [+] 443/tcp <tspan fill="#22C55E">OPEN</tspan>  <tspan fill="#94A3B8">https</tspan>   <tspan fill="#EDE8DC">Django REST Architecture (AES-256-GCM / E2EE Storage)</tspan>
    </text>

    <!-- Command 3 -->
    <text x="32" y="218">
      <tspan fill="#E0732E" font-weight="700">hardik@kali</tspan><tspan fill="#94A3B8">:</tspan><tspan fill="#4D7FA9">~</tspan><tspan fill="#E0B23A" font-weight="700">$</tspan> <tspan fill="#EDE8DC" font-weight="700">cat /root/mission.txt</tspan>
    </text>
    <!-- Output 3 -->
    <text x="32" y="240" fill="#E0B23A" font-style="italic">
      # "Build resilient architectures. Break insecure abstractions. Secure the digital perimeter."
    </text>

    <!-- Command 4 -->
    <text x="32" y="270">
      <tspan fill="#E0732E" font-weight="700">hardik@kali</tspan><tspan fill="#94A3B8">:</tspan><tspan fill="#4D7FA9">~</tspan><tspan fill="#E0B23A" font-weight="700">$</tspan> <tspan fill="#EDE8DC" font-weight="700">./display_capabilities.sh</tspan>
    </text>
    <!-- Output 4 -->
    <text x="32" y="292">
      <tspan fill="#22C55E">[✓] Web Pentesting</tspan>  <tspan fill="#4D7FA9">[✓] Network Exploitation</tspan>  <tspan fill="#E0B23A">[✓] Privilege Escalation</tspan>  <tspan fill="#E0732E">[✓] Python/Django</tspan>
    </text>
  </g>
</svg>